  .caption-bottom .editorial-caption { right: 16px; left: auto; }
  .caption-bottom .editorial-caption h2 { font-size: clamp(30px, 8.5vw, 44px); }
  .editorial-split { grid-template-columns: 1fr; height: auto; }
  .split-image { aspect-ratio: 4 / 5; }
  .split-copy { min-height: 340px; padding: 24px 18px; }
  .split-copy h2 { font-size: clamp(40px, 11vw, 64px); }
  .editorial-split.is-reversed .split-image { order: 1; }
  .editorial-split.is-reversed .split-copy { order: 2; }
  .feature-grid { grid-template-columns: 1fr; }
  .feature-card { min-height: 660px; grid-template-rows: minmax(0, 1fr) 108px; }
  .feature-card h2 { font-size: 24px; }
  .site-footer { grid-template-columns: 1fr; gap: 28px; padding: 30px 20px 44px; }
  .company-primary { white-space: normal; }
  .company-primary__row, .copyright-contact { flex-wrap: wrap; gap: 4px 16px; }
  .company-secondary { margin-top: 24px; }
  .copyright-contact &gt; * + *::before { display: none; }
  .escrow-notice { max-width: 680px; white-space: normal; }
  .footer-links { max-width: 280px; }
}

@media (max-width: 430px) {
  .editorial-hero { height: 126vw; min-height: 500px; }
  .editorial-caption h2 { font-size: 42px; }
  .dark-caption .editorial-caption h2 { font-size: 40px; }
  .split-copy { min-height: 300px; }
  .split-copy h2 { font-size: 40px; }
  .feature-card { min-height: 590px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: .01ms !important; }
}

function renderBrandCategories(brand) {
  categoryMenu.replaceChildren(

    }),

}

function closePanels() {

}

    menu.setAttribute(&quot;aria-hidden&quot;, &quot;false&quot;);
    scrim.hidden = false;

});

searchButton.addEventListener(&quot;click&quot;, () =&gt; {
  const willOpen = !searchPanel.classList.contains(&quot;is-open&quot;);

    document.querySelector(&quot;#site-search&quot;).focus();
  }
});

cartButton.addEventListener(&quot;click&quot;, () =&gt; {
  closePanels();

});

scrim.addEventListener(&quot;click&quot;, closePanels);
menuCloseButton.addEventListener(&quot;click&quot;, closePanels);
document.addEventListener(&quot;keydown&quot;, (event) =&gt; {
  if (event.key === &quot;Escape&quot;) closePanels();
});
document.querySelectorAll(&quot;.side-menu a&quot;).forEach((link) =&gt; link.addEventListener(&quot;click&quot;, closePanels));
&lt;/script&gt;
